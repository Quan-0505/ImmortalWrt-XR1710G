name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      config_seed:
        description: 'Build config'
        required: true
        default: '1710.config'
        type: choice
        options:
          - 1710.config
          - 2010.config
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build version
        id: version
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream master

          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit=$(git rev-parse --short=8 HEAD)
          upstream_base=$(git merge-base HEAD upstream/master)
          upstream_commit=$(git rev-parse --short=8 "$upstream_base")
          build_id="${build_date}-${repo_commit}-${upstream_commit}"
          # 文件名只保留 “日期-本机commit”，完整 build_id 落到 VERSION_CODE
          version_number="${build_date}-${repo_commit}"
          version_code="${build_id}"

          echo "date=$build_date" >> $GITHUB_OUTPUT
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "version_number=$version_number" >> $GITHUB_OUTPUT
          echo "version_code=$version_code" >> $GITHUB_OUTPUT
          case '${{ inputs.config_seed }}' in
            1710.config) device_model=XR1710G ;;
            2010.config) device_model=XG2010G ;;
            *) echo "Unsupported config seed: ${{ inputs.config_seed }}" >&2; exit 1 ;;
          esac
          echo "device_model=$device_model" >> $GITHUB_OUTPUT
          echo "Build version: ImmortalWrt-for-Gemtek-brightspeed $device_model $version_number"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Apply feed patches
        shell: bash
        run: |
          set -o pipefail
          # 留痕到文件：Actions 日志在本仓库读不到（token 无 Actions 读取权限），
          # 补丁不干净时只有落进 artifact 才看得到是哪一个补丁。
          FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh 2>&1 | tee feed-patches.log

      - name: Prepare kixdns and daed packages
        run: |
          set -e
          # kixdns（Rust DNS 分流/转发核心）+ LuCI 应用 + 统计核心：来自 JohnsonRan/luci-app-kixdns v1.6.0
          rm -rf /tmp/luci-app-kixdns
          git clone -q --depth 1 -b v1.6.0 https://github.com/JohnsonRan/luci-app-kixdns /tmp/luci-app-kixdns
          mkdir -p package/new
          for p in kixdns luci-app-kixdns kixdns-stats; do
            rm -rf "package/new/$p"
            cp -rf "/tmp/luci-app-kixdns/$p" "package/new/$p"
          done
          # daed（DaedNext Rust 内核）：整包替换上游 Go 版，载荷由下一步解包到 prebuilt-data/。
          # 踩坑（2026-10-06 run#9）：同名包放在 package/new/ 会被 feed 遮蔽 —— build.log 里编的是
          # feeds/packages/net/daed（上游 Go 版），本地副本从未参与构建，镜像里的 daed 因此是错的那个
          # （manifest 显示 daed - 1.27.0-r1，而我们的 rust-daed 打包版本是 3.1.3）。
          # 必须就地替换 feed 目录：feeds/packages/net/daed 与 package/feeds/packages/daed 软链都随之生效。
          rm -rf feeds/packages/net/daed
          cp -rf PATCH/daed-pkg/daed feeds/packages/net/daed
          ls -la package/new/ feeds/packages/net/daed/
          python3 - <<'PYEOF'
          import glob
          # daed 的内核前提：BTF + BPF + veth + clsact/tc。只写种子里的 CONFIG_KERNEL_* 在部分
          # target 上到不了内核 .config，因此直接改 target 内核片段：先删同键旧行，再追加期望值。
          # 注意：airoha 的内核片段在**子目标**下（target/linux/airoha/an7581/config-6.18），
          # 不在 target/linux/airoha/config-6.*；找不到片段不算失败（种子仍有 CONFIG_KERNEL_*，
          # 且构建后的 Verify plugin integration 会核对内核 .config 里 BTF 是否真的生效）。
          OPS = """
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_VETH=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_CLS_BPF=y
          """.strip().splitlines()
          frags = (sorted(glob.glob('target/linux/airoha/*/config-6.*'))
                   or sorted(glob.glob('target/linux/airoha/config-6.*'))
                   or sorted(glob.glob('target/linux/airoha/**/config-*', recursive=True)))
          if not frags:
              print('WARNING: target/linux/airoha 下没有内核片段，改由种子 CONFIG_KERNEL_* 生效；'
                    '构建后的 Verify plugin integration 会核对内核 .config')
          keys = {ln.split('=')[0] for ln in OPS}
          for f in frags:
              orig = open(f, encoding='utf-8').read().splitlines()
              kept = [ln for ln in orig if ln.split('=')[0] not in keys]
              open(f, 'w', encoding='utf-8').write('\n'.join(kept + OPS) + '\n')
              print('kernel dae opts -> %s (%d -> %d lines)' % (f, len(orig), len(kept) + len(OPS)))
          PYEOF

      - name: Fetch plugin prebuilt payloads (kixdns + daed)
        run: |
          set -e
          curl -sSL --retry 4 --retry-all-errors -o /tmp/kix.tgz \
            "https://github.com/JohnsonRan/luci-app-kixdns/releases/download/v1.6.0/kixdns_aarch64_cortex-a53-openwrt-24.10.tar.gz"
          rm -rf /tmp/kix && mkdir -p /tmp/kix && tar -xzf /tmp/kix.tgz -C /tmp/kix
          python3 - <<'PYEOF'
          import glob, gzip, io, os, tarfile
          # kixdns / kixdns-stats 的预编译 musl 静态二进制：从发布 ipk 里取出放进
          # package/new/<pkg>/prebuilt/，Makefile 见到就不再拉 Go 工具链。
          JOBS = [
              ('/tmp/kix/kixdns_*.ipk', './usr/bin/kixdns', 'kixdns', 'kixdns'),
              ('/tmp/kix/kixdns-stats_*.ipk', './usr/libexec/kixdns-stats-core', 'kixdns-stats', 'kixdns-stats-core'),
          ]
          for pattern, member, pkg, fname in JOBS:
              hits = glob.glob(pattern)
              if not hits:
                  raise SystemExit('missing %s in the release tarball' % pattern)
              outer = tarfile.open(fileobj=io.BytesIO(gzip.decompress(open(hits[0], 'rb').read())), mode='r:')
              data = outer.extractfile('./data.tar.gz').read()
              tf = tarfile.open(fileobj=io.BytesIO(gzip.decompress(data)), mode='r:')
              blob = tf.extractfile(member).read()
              dst = os.path.join('package', 'new', pkg, 'prebuilt')
              os.makedirs(dst, exist_ok=True)
              path = os.path.join(dst, fname)
              open(path, 'wb').write(blob)
              os.chmod(path, 0o755)
              print('%-46s -> %s (%d bytes)' % (member, path, len(blob)))
          PYEOF
          python3 - <<'PYEOF'
          import gzip, io, os, shutil, tarfile, urllib.request
          # daed：Quan-0505/rust-daed v3.1.3 的 aarch64 载荷。usr/bin/daed 是静态 AArch64
          # （无解释器），与 AN7581 的 Cortex-A53 同核的 r2s 资产最贴近。
          url = 'https://github.com/Quan-0505/rust-daed/releases/download/v3.1.3/rust-daed-r2s.apk'
          print('fetching', url)
          with urllib.request.urlopen(url, timeout=600) as resp:
              raw = resp.read()
          if raw[:2] != b'\x1f\x8b':
              raise SystemExit('unexpected payload magic %s (want gzip/apk v2)' % raw[:4].hex())
          tf = tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw)), mode='r:')
          # 与上一步同因：载荷必须解进 feed 里那棵 daed 源树
          dst = os.path.join('feeds', 'packages', 'net', 'daed', 'prebuilt-data')
          shutil.rmtree(dst, ignore_errors=True)
          for m in tf.getmembers():
              if m.name.startswith('usr/') or m.name.startswith('etc/'):
                  p = os.path.join(dst, m.name)
                  if m.isdir():
                      os.makedirs(p, exist_ok=True)
                  elif m.isfile():
                      os.makedirs(os.path.dirname(p), exist_ok=True)
                      with open(p, 'wb') as f:
                          f.write(tf.extractfile(m).read())
          web_dst = os.path.join(dst, 'usr', 'share', 'daed', 'web')
          shutil.copytree(os.path.join('PATCH', 'daed-web'), web_dst, dirs_exist_ok=True)
          if not os.path.isfile(os.path.join(dst, 'etc', 'init.d', 'daed')):
              raise SystemExit('daed payload is missing etc/init.d/daed')
          print('payload daed: %d bytes' % os.path.getsize(os.path.join(dst, 'usr', 'bin', 'daed')))
          print('payload files: %d (web %d)' % (sum(len(fs) for _, _, fs in os.walk(dst)),
                                                sum(len(fs) for _, _, fs in os.walk(web_dst))))
          PYEOF

      - name: Prepare footstrap theme (LuCI)
        run: |
          set -e
          # 主题用 luci feed 自带的 luci-theme-footstrap（immortalwrt/luci）。
          # 踩坑（2026-10-06 run#9）：同名主题放 package/new/ 同样被 feed 遮蔽 —— build.log 里编的是
          # feed 版（没有 po/zh_Hans），于是 luci.mk 不生成 luci-i18n-footstrap-zh-cn，种子里的
          # CONFIG_PACKAGE_luci-i18n-footstrap-zh-cn 被 make defconfig 静默丢掉，插件校验随之失败。
          # 正确做法是往 feed 的主题目录里补 po：luci.mk 以 po/* 的**目录名**为语言（LUCI_LANGUAGES），
          # 再经 LUCI_LC_ALIAS.zh_Hans=zh-cn 映射成包名后缀，po 文件名本身不参与命名（po/<lang>/*.po 通配）。
          theme_dir=feeds/luci/themes/luci-theme-footstrap
          test -d "$theme_dir" || { echo "缺少 feed 主题目录：$theme_dir" >&2; exit 1; }
          rm -rf "$theme_dir/po/zh_Hans"
          mkdir -p "$theme_dir/po/zh_Hans"
          cp -f PATCH/theme-footstrap-zh/zh_Hans/footstrap.po "$theme_dir/po/zh_Hans/footstrap.po"
          ls -la "$theme_dir" | head -20
          ls -la "$theme_dir/po/zh_Hans"

      - name: Configure
        shell: bash
        run: |
          set -uo pipefail
          # 全过程留痕到 configure.log：Actions 日志在本仓库不可读（token 无 Actions 读取权限），
          # 但 artifact 可以下载，因此失败原因必须落到文件里。
          #
          # bash 坑（踩过两次）：把这几步包成函数再放进 `if configure; then` 里，函数体内的
          # set -e 同样失效（手册原话：即使设置了 -e 也不生效），于是 make defconfig 的失败会被
          # 后面 grep 的成功掩盖。这里改用 `step && step && step` 链 + rc=$? 显式判定，不用函数+if。
          run_step() {
            echo "### $1"
            shift
            "$@"
          }
          {
            run_step 'cp seed' cp '${{ inputs.config_seed }}' .config &&
            run_step 'set-build-version' env \
              BUILD_DATE='${{ steps.version.outputs.date }}' \
              BUILD_ID='${{ steps.version.outputs.build_id }}' \
              REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
              UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
              VERSION_CODE='${{ steps.version.outputs.version_code }}' \
              bash scripts/set-build-version.sh .config &&
            run_step 'make defconfig' make defconfig &&
            run_step 'gemtek profile isolation' bash scripts/check-gemtek-profile-isolation.sh --config .config &&
            run_step 'version symbols' grep -E 'CONFIG_(IMAGEOPT|EXTRA_IMAGE_NAME|VERSIONOPT|VERSION_DIST|VERSION_NUMBER|VERSION_CODE|VERSION_FILENAMES|VERSION_CODE_FILENAMES)[= ]' .config
          } > configure.log 2>&1
          rc=$?
          tail -30 configure.log
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          echo '=== 配置阶段失败（rc='"$rc"'）：configure.log 末尾 100 行 ==='
          tail -100 configure.log || true
          echo ''
          echo '=== 对照实验：用 fork 初始种子（未经本仓库裁剪）重跑 defconfig ==='
          if git fetch --depth 1 origin 401e088 >/dev/null 2>&1 && git show FETCH_HEAD:1710.config > /tmp/orig.config; then
            cp /tmp/orig.config .config
            if make defconfig > defconfig-control.log 2>&1; then
              echo 'CONTROL=原始种子 defconfig 成功 → 失败很可能由本仓库的配置改动引起'
            else
              echo 'CONTROL=原始种子 defconfig 也失败 → 与配置改动无关（源码树/上游或环境问题）'
              tail -40 defconfig-control.log || true
            fi
          else
            echo 'CONTROL=无法取得原始种子，跳过对照'
          fi
          exit 1

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gemtek-configure-diagnostics
          path: |
            configure.log
            feed-patches.log
            defconfig-control.log
            .config
          if-no-files-found: ignore
          retention-days: 30

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build Firmware
        shell: bash
        run: |
          make -j2 world 2>&1 | tee build.log

      - name: Verbose retry on build failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          failed=$(grep 'ERROR:.*failed to build' build.log | head -1 | sed 's/.*ERROR: \(.*\) failed to build.*/\1/' || true)
          echo "失败目标：${failed:-<未识别>}"
          if [ -z "$failed" ]; then
            tail -150 build.log || true
            exit 0
          fi

          # 目标名可能是 target/linux 这类目录，也可能是包名。
          # 之前无条件拼成 package/<名>/compile：遇到 target/linux 就变成
          # 「No rule to make target 'package/target/linux/compile'」，等于什么都没重试。
          case "$failed" in
            target/*|toolchain/*|tools/*)
              echo "=== $failed 是顶层目录：按 $failed/install 重试（镜像组装就发生在 install 阶段）==="
              make "$failed/install" V=s -j1 2>&1 | tee build-verbose.log || true
              if ! grep -qE 'Error [0-9]+|error:|No rule to make target' build-verbose.log; then
                echo "=== install 没有报错，再按 $failed/compile 重试 ==="
                make "$failed/compile" V=s -j1 2>&1 | tee -a build-verbose.log || true
              fi
              ;;
            *)
              echo "=== Rebuilding package/$failed with V=s ==="
              make "package/$failed/compile" V=s -j1 2>&1 | tee build-verbose.log || true
              ;;
          esac

          {
            echo "=== failed target: $failed ==="
            bash scripts/summarize-build-errors.sh build.log || true
            echo
            echo "=== logs/ 目录 ==="
            ls -la logs 2>/dev/null | head -30 || echo "no logs/ directory"
            echo
            echo "=== build-verbose.log 关键行 ==="
            grep -nE 'error:|Error [0-9]+|FAILED|No rule to make target|Stop\.|undefined reference|not found' build-verbose.log 2>/dev/null | head -60 || echo "no markers"
            echo
            echo "=== build-verbose.log 末尾 120 行 ==="
            tail -120 build-verbose.log 2>/dev/null || true
            echo
            echo "=== bin/targets 现状 ==="
            find bin/targets -maxdepth 3 -type f 2>/dev/null | head -40 || true
          } > build-failure.log 2>&1 || true
          echo "=== build-failure.log ==="
          cat build-failure.log || true

      - name: Verify device isolation
        shell: bash
        run: |
          bash scripts/check-firmware-artifacts.sh \
            --config .config \
            --directory bin/targets/airoha/an7581
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/linux-*/.config' -print -quit)
          manifest=$(find bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*manifest' -print -quit)
          test -n "$kernel_config"
          test -n "$manifest"
          bash scripts/check-gemtek-profile-isolation.sh \
            --config .config \
            --kernel-config "$kernel_config" \
            --manifest "$manifest"

      - name: Verify plugin integration (kixdns + daed)
        shell: bash
        run: |
          set -e
          # Actions 日志在本仓库读不到（token 无 Actions 读取权限），因此把这一步的完整 trace
          # 落进 plugin-check.log 并随 artifact 上传：失败时不必再靠推理猜是哪条断言挂的。
          exec > >(tee plugin-check.log) 2>&1
          set -x
          echo '=== .config 插件开关 ==='
          for p in daed kixdns kixdns-stats luci-app-kixdns ip-full; do
            grep -Fqx "CONFIG_PACKAGE_${p}=y" .config || { echo "missing CONFIG_PACKAGE_${p}=y" >&2; exit 1; }
          done
          grep -E '^CONFIG_PACKAGE_(daed|kixdns|kixdns-stats|luci-app-kixdns|ip-full)=y$' .config
          echo '=== 内核 BTF/BPF/veth/clsact（daed 运行前提）==='
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 -path '*/linux-*/.config' -print -quit)
          test -n "$kernel_config"
          for sym in CONFIG_DEBUG_INFO_BTF CONFIG_BPF_SYSCALL CONFIG_VETH CONFIG_NET_CLS_ACT CONFIG_NET_CLS_BPF CONFIG_NET_SCH_INGRESS; do
            grep -Eq "^${sym}=y$" "$kernel_config" || { echo "kernel is missing ${sym}=y" >&2; exit 1; }
            grep -E "^${sym}=y$" "$kernel_config"
          done
          echo '=== 构建产物里的插件包 ==='
          find bin -name 'daed-*.apk' -o -name 'kixdns-*.apk' -o -name 'kixdns-stats-*.apk' \
            -o -name 'luci-app-kixdns-*.apk' -o -name 'luci-i18n-footstrap-zh-cn-*.apk' | sort
          for pat in 'daed-*.apk' 'kixdns-*.apk' 'kixdns-stats-*.apk' 'luci-app-kixdns-*.apk' \
                     'luci-i18n-footstrap-zh-cn-*.apk'; do
            n=$(find bin -name "$pat" | wc -l)
            echo "$pat -> $n"
            [ "$n" -ge 1 ] || { echo "no built package matching $pat" >&2; exit 1; }
          done
          echo '=== daed 源树必须是我们打包的 rust-daed（防再次被 feed 遮蔽）==='
          grep -q 'prebuilt-data' feeds/packages/net/daed/Makefile \
            || { echo 'feeds/packages/net/daed 不是 rust-daed 打包（prebuilt-data 缺失）' >&2; exit 1; }
          grep -E '^PKG_(VERSION|RELEASE|SOURCE_VERSION):=' feeds/packages/net/daed/Makefile || true
          grep -E '^daed[[:space:]]' bin/targets/airoha/an7581/*manifest | grep -q '3\.1\.3' \
            || { echo '镜像 manifest 里的 daed 不是 3.1.3（很可能又编成 feed 的上游 Go 版）' >&2; exit 1; }
          echo '=== 载荷与镜像 ==='
          ls -lh feeds/packages/net/daed/prebuilt-data/usr/bin/daed package/new/kixdns/prebuilt/kixdns package/new/kixdns-stats/prebuilt/kixdns-stats-core
          ls -lh bin/targets/airoha/an7581/*.itb
          echo '=== footstrap 主题 + 默认主题 ==='
          for p in luci-theme-footstrap luci-i18n-footstrap-zh-cn; do
            grep -Fqx "CONFIG_PACKAGE_${p}=y" .config || { echo "missing CONFIG_PACKAGE_${p}=y" >&2; exit 1; }
            grep -E "^CONFIG_PACKAGE_${p}=y$" .config
          done
          theme_default=target/linux/airoha/an7581/base-files/etc/uci-defaults/91-xr1710g-theme.sh
          test -x "$theme_default" || { echo "默认主题脚本缺失或不可执行：$theme_default" >&2; exit 1; }
          grep -Fq "luci-static/footstrap" "$theme_default"
          cat "$theme_default"
          n=$(find bin -name 'luci-theme-footstrap-*.apk' | wc -l)
          echo "luci-theme-footstrap-*.apk -> $n"
          [ "$n" -ge 1 ] || { echo 'no built footstrap theme package' >&2; exit 1; }
          find bin -name 'luci-theme-footstrap-*.apk' -o -name 'luci-i18n-footstrap-*.apk' | sort
          echo '=== 镜像 manifest 里的主题（证明真的装进镜像）==='
          for p in luci-theme-footstrap luci-i18n-footstrap-zh-cn; do
            grep -qE "^${p}[[:space:]]" bin/targets/airoha/an7581/*manifest \
              || { echo "image manifest is missing ${p}" >&2; exit 1; }
            grep -E "^${p}[[:space:]]" bin/targets/airoha/an7581/*manifest
          done

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log | tee build-errors.txt || true
            tail -100 build.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gemtek-${{ inputs.config_seed }}-firmware
          path: |
            build.log
            build-verbose.log
            build-failure.log
            build-errors.txt
            configure.log
            defconfig-control.log
            plugin-check.log
            .config
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*manifest
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          # .config 是隐藏文件：不打开这个开关它不会被上传（上一轮诊断就吃了这个亏）
          include-hidden-files: true
          retention-days: 30
        if: always()

      - name: Build release body
        if: github.event.inputs.release_type != 'none'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            printf '%s\n' "$RELEASE_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          name: ${{ format('{0} - Gemtek {1} Build ({2})', steps.version.outputs.date, steps.version.outputs.device_model, steps.version.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
